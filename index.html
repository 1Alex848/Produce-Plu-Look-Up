<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produce PLU Lookup</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f6f6f6; }
    header { background-color: #4CAF50; color: white; padding: 1em; text-align: center; }
    main { padding: 1em; }
    .controls { display: flex; flex-direction: column; gap: 0.5em; margin-bottom: 1em; }
    input[type="text"], select {
      width: 100%; padding: 0.5em; font-size: 1em; border: 1px solid #ccc; border-radius: 5px;
    }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 0.75em; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f2f2f2; }
    @media (min-width: 768px) {
      body { padding: 2em; }
      main { max-width: 800px; margin: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Produce PLU Lookup</h1>
  </header>
  <main>
    <div class="controls">
      <input type="text" id="search" placeholder="Search for an item or PLU..." />
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>
    </div>
    <table id="pluTable">
      <thead>
        <tr>
          <th>Category</th>
          <th>Item</th>
          <th>PLU</th>
          <th>Organic(prefix 9)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script>
    const data = [];

    fetch('Produce_PLU_Master_List.json')
      .then(response => response.json())
      .then(json => {
        data.push(...json);
        populateCategoryDropdown();
        updateTable(data);
      });

    const tableBody = document.querySelector('#pluTable tbody');
    const searchInput = document.getElementById('search');
    const categorySelect = document.getElementById('categoryFilter');

    function updateTable(items) {
      tableBody.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.category}</td>
          <td>${item.item}</td>
          <td>${item.plu}</td>
          <td>${item.organic_available ? 'Yes' : ''}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function populateCategoryDropdown() {
      const categories = [...new Set(data.map(item => item.category))].sort();
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    function filterData() {
      const term = searchInput.value.toLowerCase();
      const selectedCategory = categorySelect.value;
      const filtered = data.filter(item => {
        const matchesSearch = item.item.toLowerCase().includes(term) ||
                              item.plu.includes(term) ||
                              item.category.toLowerCase().includes(term);
        const matchesCategory = selectedCategory === '' || item.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });
      updateTable(filtered);
    }

    searchInput.addEventListener('input', filterData);
    categorySelect.addEventListener('change', filterData);
  </script>
</body>
</html>
